[project]
name = "alivia-actuator-edge"
version = "1.0.0"
description = "Edge de actuadores de Alivia: broker MQTT <-> ESP32 con servos (WebSocket o Bluetooth)"
requires-python = ">=3.11"
dependencies = ["websockets>=14", "paho-mqtt>=2.0", "pyserial>=3.5", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "amqtt>=0.11"]

[project.scripts]
alivia-actuator-edge = "alivia_actuator_edge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
